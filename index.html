<!doctype html>
<html lang="ro" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var _currentFetch = origFetch;
          
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return _currentFetch;
                },
                set: function(val) {
                  _currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e2) {}
          }
        } catch (e) {}
      })();
    </script>
    <title>ResolveLUT Studio</title>
    <meta name="description" content="Generator profesional de LUT-uri 3D (.cube) pentru DaVinci Resolve Studio cu roți de culoare, curbe RGB, emulări de film și osciloscoape video în timp real." />
